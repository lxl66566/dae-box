[package]
edition    = "2024"
license    = "Apache-2.0"
name       = "dae-box"
repository = "https://github.com/lxl66566/dae-box"
version    = "0.1.0"


[dependencies]
anyhow     = "1"
clap       = { version = "4", features = ["derive"] }
serde_json = "1"
sing-dae   = { git = "https://github.com/lxl66566/sing-dae" }
tempfile   = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
lto       = true
opt-level = "s"
panic     = "abort"
strip     = true
